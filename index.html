<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>PRIVATE SERVER - WEBSITE | PANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0a0a;
            --surface: #121212;
            --surface2: #1c1c1c;
            --surface3: #262626;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #b0b0b0;
            --text: #f0f0f0;
            --text-dim: #a8a8b0;
            --text-faint: #707070;
            --success: #4ade80;
            --cpu: #fbbf24;
            --ram: #60a5fa;
            --storage: #4ade80;
            --purple: #c084fc;
            --yellow: #fbbf24;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 60% 40% at 20% 30%, rgba(176, 176, 176, 0.04) 0%, transparent 60%), radial-gradient(ellipse 50% 30% at 80% 70%, rgba(176, 176, 176, 0.02) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .noise {
            position: fixed;
            inset: 0;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-size: 200px;
            pointer-events: none;
            z-index: 0;
        }
        #app {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* TOPBAR */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 32px;
            border-bottom: 1px solid var(--border);
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-left {
            display: flex;
            align-items: center;
        }
        .topbar-logo {
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .topbar-logo img {
            height: 54px;
            width: auto;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
            transition: transform 0.1s ease;
        }
        .topbar-logo img:hover {
            transform: scale(0.98);
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .burger-btn {
            width: 42px;
            height: 42px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            z-index: 201;
        }
        .burger-btn:hover {
            background: var(--surface3);
        }
        .burger-btn.open {
            background: var(--surface3);
            border-color: var(--accent);
        }
        .burger-line {
            width: 20px;
            height: 2px;
            background: var(--text-dim);
            border-radius: 2px;
            transition: all 0.2s;
        }
        .burger-btn.open .burger-line:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }
        .burger-btn.open .burger-line:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .burger-btn.open .burger-line:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* BURGER MENU */
        .burger-menu {
            position: fixed;
            top: 74px;
            right: 24px;
            width: 270px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6);
            z-index: 200;
            overflow: hidden;
            transform: translateY(-8px) scale(0.96);
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .burger-menu.open {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: all;
        }
        .burger-menu-header {
            padding: 18px 20px 12px;
            border-bottom: 1px solid var(--border);
        }
        .burger-menu-user {
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.3px;
        }
        .burger-menu-sub {
            font-size: 11px;
            color: var(--text-faint);
            margin-top: 4px;
        }
        .burger-nav {
            padding: 8px 10px;
        }
        .burger-nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-dim);
        }
        .burger-nav-item:hover {
            background: var(--surface3);
            color: var(--text);
        }
        .burger-nav-item.active {
            background: rgba(176, 176, 176, 0.12);
            color: var(--accent);
        }
        .burger-nav-item .nav-icon {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .burger-nav-item .nav-icon img {
            width: 24px;
            height: 24px;
            filter: brightness(0) invert(1);
            object-fit: contain;
        }
        .burger-overlay {
            position: fixed;
            inset: 0;
            z-index: 199;
            display: none;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(3px);
        }
        .burger-overlay.open {
            display: block;
        }

        /* PAGE CONTAINER */
        .page-container {
            flex: 1;
            padding: 28px 32px 40px;
        }
        .page {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* DASHBOARD CARDS */
        .dash-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px 22px;
            backdrop-filter: blur(4px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }
        .dash-card:hover { border-color: rgba(255,255,255,0.18); }
        .dash-card h2 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #f0f0f0, #b0b0b0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .dash-card h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }

        .dash-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }
        .dash-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dash-header-left i {
            font-size: 26px;
            color: var(--text-faint);
        }
        .dash-header-info h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text);
        }
        .dash-header-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .badge-id {
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 4px 14px;
            font-size: 11px;
            font-family: monospace;
            color: var(--text-faint);
            letter-spacing: 0.5px;
        }
        .badge-ip {
            font-size: 11px;
            color: var(--text-faint);
            font-family: monospace;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
        }
        .status-online {
            background: rgba(34,197,94,0.1);
            border: 1px solid rgba(34,197,94,0.25);
            color: #4ade80;
        }
        .status-offline {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            color: #f87171;
        }
        .pulse-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 1.6s infinite;
        }
        .status-offline .pulse-dot { background: #f87171; animation: none; }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(1.25); }
            100% { opacity: 1; transform: scale(1); }
        }
        .dash-header-footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-faint);
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .metric-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }
        .metric-box {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 14px;
            text-align: center;
            transition: all 0.2s;
        }
        .metric-box:hover { border-color: rgba(255,255,255,0.2); background: var(--surface3); }
        .metric-box i { font-size: 22px; margin-bottom: 8px; }
        .metric-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-faint); margin-bottom: 4px; }
        .metric-value { font-family: 'Rajdhani', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .metric-cpu { color: var(--cpu); }
        .metric-ram { color: var(--ram); }
        .metric-storage { color: var(--storage); }

        .progress-group { margin-bottom: 14px; }
        .progress-group:last-child { margin-bottom: 0; }
        .progress-label-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; color: var(--text-dim); }
        .progress-val { font-family: monospace; font-weight: 500; }
        .progress-bar { height: 7px; background: var(--surface3); border-radius: 999px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
        .progress-fill.cpu { background: var(--cpu); }
        .progress-fill.ram { background: var(--ram); }
        .progress-fill.storage { background: var(--storage); }

        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; }
        .cat-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 16px 10px; transition: all 0.2s; }
        .cat-box:hover { border-color: rgba(255,255,255,0.2); background: var(--surface3); }
        .cat-tag { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 8px; }
        .tag-starts { background: rgba(34,197,94,0.12); color: #4ade80; border:1px solid rgba(34,197,94,0.2); }
        .tag-bfg { background: rgba(168,85,247,0.12); color: #c084fc; border:1px solid rgba(168,85,247,0.2); }
        .tag-shop { background: rgba(245,158,11,0.12); color: #fbbf24; border:1px solid rgba(245,158,11,0.2); }
        .tag-other { background: rgba(107,114,128,0.12); color: #9ca3af; border:1px solid rgba(107,114,128,0.2); }
        .cat-count { font-family: 'Rajdhani', sans-serif; font-size: 28px; font-weight: 800; }
        .cat-count.green { color: #4ade80; }
        .cat-count.purple { color: #c084fc; }
        .cat-count.yellow { color: #fbbf24; }

        .chart-wrap { position: relative; height: 200px; width: 100%; }
        .chart-wrap canvas { width: 100% !important; height: 100% !important; }
        .chart-legend { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-faint); margin-top: 6px; padding: 0 4px; }

        .world-stats-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .world-stat-pill { background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 5px 14px; font-size: 11px; color: var(--text-dim); }
        .world-stat-pill span { font-weight: 600; color: var(--text); font-family: monospace; }
        .worlds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
        .world-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .world-card:hover { border-color: rgba(74,222,128,0.4); background: var(--surface3); }
        .world-card .world-name { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .world-cat-tag { font-size: 9px; font-weight: 600; letter-spacing: 0.3px; }
        .world-skeleton { background: var(--surface2); border:1px solid var(--border); border-radius:12px; padding:14px 8px; text-align:center; animation:pulseSkel 1.2s infinite; }
        .world-skeleton .skel-line { height:10px; background:var(--surface3); border-radius:4px; margin:0 auto 6px; }
        .world-skeleton .skel-line:first-child { width:70%; }
        .world-skeleton .skel-line:last-child { width:45%; height:8px; }
        @keyframes pulseSkel { 0%,100%{opacity:0.5;} 50%{opacity:0.8;} }

        .dash-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

        .toast-simple { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface); border: 1px solid var(--border); border-radius: 40px; padding: 10px 24px; font-size: 13px; font-weight: 500; color: var(--text); box-shadow: 0 8px 20px rgba(0,0,0,0.4); z-index: 999; transition: transform 0.2s, opacity 0.2s; opacity: 0; pointer-events: none; white-space: normal; word-break: break-word; text-align: center; max-width: 90vw; }
        .toast-simple.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .info-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 32px 28px; backdrop-filter: blur(4px); box-shadow: 0 12px 28px rgba(0,0,0,0.3); }
        .info-card h2 { font-family: 'Rajdhani',sans-serif; font-size:28px; font-weight:700; margin-bottom:16px; letter-spacing:-0.3px; background:linear-gradient(135deg,#f0f0f0,#b0b0b0); -webkit-background-clip:text; background-clip:text; color:transparent; }
        .info-card p { color: var(--text-dim); line-height:1.5; font-size:16px; margin-bottom:20px; }
        .info-highlight { background: rgba(176,176,176,0.08); border-left:3px solid var(--accent); padding:14px 18px; border-radius:12px; font-size:14px; color:var(--text); margin-bottom:20px; }
        .placeholder-list { margin-top:20px; display:flex; flex-direction:column; gap:12px; }
        .placeholder-item { background:var(--surface2); padding:12px 18px; border-radius:14px; font-size:14px; border:1px solid var(--border); color:var(--text-dim); }

        .host-section { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px; backdrop-filter:blur(4px); margin-bottom:28px; }
        .host-header { display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); padding-bottom:14px; margin-bottom:18px; }
        .host-header i { font-size:24px; color:var(--success); }
        .host-header h2 { font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:600; letter-spacing:-0.2px; background:none; -webkit-background-clip:unset; background-clip:unset; color:var(--text); }
        .host-item { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 14px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
        .host-item:hover { border-color:rgba(255,255,255,0.2); background:var(--surface3); }
        .host-info { display:flex; align-items:center; gap:10px; }
        .host-info i, .host-info .custom-icon { font-size:18px; width:24px; text-align:center; color:var(--text-dim); }
        .host-info .custom-icon-img { width:20px; height:20px; filter:brightness(0) invert(1); object-fit:contain; vertical-align:middle; }
        .host-name { font-weight:600; color:var(--text); font-size:14px; }
        .host-platform { font-size:11px; color:var(--text-faint); margin-left:6px; }
        .host-actions { display:flex; gap:8px; }
        .copy-btn { background:rgba(255,255,255,0.05); border:1px solid var(--border); padding:6px 12px; border-radius:30px; font-size:12px; font-weight:500; color:var(--text-dim); display:inline-flex; align-items:center; gap:6px; cursor:pointer; transition:all 0.2s; }
        .copy-btn:hover { background:rgba(255,255,255,0.1); color:var(--text); border-color:var(--accent); }
        .download-btn { background:rgba(255,255,255,0.05); border:1px solid var(--border); padding:6px; border-radius:30px; color:var(--text-dim); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; tra
